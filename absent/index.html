<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absent | Minimalist launcher.</title>
    <meta name="description" content="Absent: A minimalist Android launcher by Dattara Apps, engineered for intentionality over noise.">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dattara.app/absent/">
    <meta property="og:title" content="Absent | Minimalist launcher.">
    <meta property="og:description" content="A minimalist Android launcher engineered to reclaim your time.">
    <meta property="og:image" content="https://dattara.app/svg/absent.svg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://dattara.app/absent/">
    <meta property="twitter:title" content="Absent | Minimalist launcher.">
    <meta property="twitter:description" content="A minimalist Android launcher engineered to reclaim your time.">
    <meta property="twitter:image" content="https://dattara.app/svg/absent.svg">

    <link rel="icon" type="image/svg+xml" href="../svg/absent.svg" id="favicon">
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('theme') || 'dark';
                document.documentElement.setAttribute('data-theme', theme);
                // Set initial favicon
                const favicon = document.getElementById('favicon');
                if (favicon) {
                    favicon.href = theme === 'light' ? '../svg/absent-black.svg' : '../svg/absent-black.svg';
                }
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        :root {
            --bg-color: #fff;
            --text-color: #000;
            --accent-color: #eee;
            --secondary-text: #666;
            --border-color: #ddd;
            --dot-active: #000;
            --dot-inactive: #ddd;
        }

        [data-theme="dark"] {
            --bg-color: #000;
            --text-color: #fff;
            --accent-color: #333;
            --secondary-text: #888;
            --border-color: #444;
            --dot-active: #fff;
            --dot-inactive: #333;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg-color);
            max-width: 1200px;
            transition: background 0.3s;
            contain: content;
        }

        .scroll-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .scroll-content::-webkit-scrollbar { display: none; }

        /* --- SINGLE LINE HEADER --- */
        header {
            width: 100%;
            padding: 20px 0;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .brand-line {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            white-space: nowrap;
            font-size: clamp(10px, 3.5vw, 22px);
            flex: 1;
            min-width: 0;
        }

        .brand-logo {
            height: 2.2em;
            width: auto;
            display: block;
            flex-shrink: 0;
        }

        .brand-name {
            display: flex;
            align-items: center;
            min-width: 0;
            gap: 10px;
            text-decoration: none;
            color: inherit;
        }

        .brand-text {
            font-weight: bold;
            letter-spacing: 2px;
        }

        .brand-divider {
            margin: 0 10px;
            color: var(--text-color);
            font-weight: bold;
            display: inline-block;
            transform: scaleY(1.4);
            opacity: 0.9;
            flex-shrink: 0;
        }

        .tagline {
            color: var(--secondary-text);
            font-weight: normal;
            letter-spacing: 1px;
            font-size: 0.85em;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Theme Toggle --- */
        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 8px;
            font-size: 1.2rem;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .theme-toggle:active {
            transform: scale(0.95);
            background: var(--accent-color);
        }

        @media (max-width: 480px) {
            .brand-divider, .tagline {
                display: none;
            }
            .brand-line {
                font-size: 18px;
            }
            header {
                padding: 15px 0;
            }
        }

        /* --- Main Intro --- */
        .app-intro {
            text-align: center;
            margin: 40px 0;
            width: 100%;
        }

        .app-name {
            font-size: clamp(1.5rem, 10vw, 2.5rem);
            letter-spacing: 10px;
            font-weight: bold;
            display: block;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .app-summary {
            color: var(--secondary-text);
            font-size: 0.85rem;
            line-height: 1.6;
            max-width: 320px;
            margin: 0 auto;
        }

        .cta-section {
            padding: 40px 0;
            text-align: center;
            width: 100%;
        }

        .social-links {
            display: flex;
            gap: 25px;
            justify-content: center;
            margin: 20px 0;
        }

        .social-icon {
            width: 20px;
            height: 20px;
            fill: var(--secondary-text);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .social-icon:hover {
            fill: var(--text-color);
            transform: translateY(-2px);
        }

        .btn-coming-soon {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            padding: 12px 30px;
            font-family: inherit;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .btn-coming-soon:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        footer {
            padding: 30px 20px;
            text-align: center;
            font-size: 0.65rem;
            color: var(--secondary-text);
            letter-spacing: 1px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .footer-copyright-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0.6;
        }

        .footer-logo-small {
            height: 2.2em;
            width: auto;
        }

        /* Hide logos that don't match theme */
        [data-theme="light"] .theme-dark-only { display: none; }
        [data-theme="dark"] .theme-light-only { display: none; }

    </style>
</head>
<body>
    <div class="app-container">
        <div class="scroll-content">
            <header>
                <div class="brand-line">
                    <a href="/" class="brand-name">
                        <img src="../svg/absent-black.svg" alt="ABSENT" class="brand-logo theme-light-only" decoding="async">
                        <img src="../svg/absent.svg" alt="ABSENT" class="brand-logo theme-dark-only" decoding="async">
                        <span class="brand-text">ABSENT</span>
                    </a>
                    <span class="brand-divider">|</span>
                    <span class="tagline">Minimalist launcher.</span>
                </div>
                <button class="theme-toggle" id="themeToggle" title="Toggle Theme">
                    <span class="theme-light-only">●</span>
                    <span class="theme-dark-only">○</span>
                </button>
            </header>

            <main>
                <section class="app-intro">
                    <span class="app-name">ABSENT</span>
                    <p class="app-summary">
                        A minimalist Android launcher engineered to reclaim your time.
                    </p>
                </section>

                <section class="cta-section">
                    <button class="btn-coming-soon">Coming Soon</button>
                </section>
            </main>

            <footer>

                    <!-- YouTube -->
                    <a href="#" aria-label="YouTube" target="_blank">
                        <svg class="social-icon" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>

                    <!-- GitHub -->
                    <a href="#" aria-label="GitHub" target="_blank">
                        <svg class="social-icon" viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                    </a>
                    <!-- LinkedIn -->
                    <a href="#" aria-label="LinkedIn" target="_blank">
                        <svg class="social-icon" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                    </a>
                </div>
                <div class="footer-copyright-line">
                    <img src="../svg/dattara-logo-small-black.svg" alt="Logo" class="footer-logo-small theme-light-only" loading="lazy" decoding="async">
                    <img src="../svg/dattara-logo-small.svg" alt="Logo" class="footer-logo-small theme-dark-only" loading="lazy" decoding="async">
                    <span>&copy; 2026 DATTARA APPS. ALL RIGHTS RESERVED.</span>
                </div>
                <div style="margin-top: 10px;">
                    <a href="mailto:contact@dattara.app" style="color: inherit; text-decoration: none; border-bottom: 1px solid #444;">contact@dattara.app</a>
                </div>
                <div style="margin-top: 10px; display: flex; gap: 20px; justify-content: center;">
                    <a href="privacy" style="color: #666; text-decoration: none; font-size: 0.6rem; letter-spacing: 1px;">ABSENT PRIVACY</a>
                </div>
            </footer>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('themeToggle');
            if (!themeToggle) return;

            themeToggle.addEventListener('click', () => {
                try {
                    const currentTheme = document.documentElement.getAttribute('data-theme');
                    const newTheme = currentTheme === 'light' ? 'dark' : 'light';

                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('theme', newTheme);

                    // Update favicon
                    const favicon = document.getElementById('favicon');
                    if (favicon) {
                        favicon.href = newTheme === 'light' ? '../svg/absent-black.svg' : '../svg/absent-black.svg';
                    }
                } catch (e) {
                    console.error('Failed to save theme preference:', e);
                }
            });
        });
    </script>
</body>
</html>
