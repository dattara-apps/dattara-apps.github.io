    <link rel="icon" type="image/svg+xml" href="../svg/absent.svg" id="favicon">
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('theme') || 'dark';
                document.documentElement.setAttribute('data-theme', theme);
                // Set initial favicon
                const favicon = document.getElementById('favicon');
                if (favicon) {
                    favicon.href = theme === 'light' ? '../svg/absent-black.svg' : '../svg/absent.svg';
                }
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fff;
            --text-color: #000;
            --accent-color: #eee;
            --secondary-text: #666;
            --border-color: #ddd;
            --dot-active: #000;
            --dot-inactive: #ddd;
            --primary: #C62828;
            --secondary: #FB8C00;
        }

        [data-theme="dark"] {
            --bg-color: #000;
            --text-color: #fff;
            --accent-color: #333;
            --secondary-text: #888;
            --border-color: #444;
            --dot-active: #fff;
            --dot-inactive: #333;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg-color);
            max-width: 1200px;
            transition: background 0.3s;
            contain: content;
        }

        .scroll-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .scroll-content::-webkit-scrollbar { display: none; }

        /* --- CORPORATE HEADER CONCEPT --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            width: 100%;
            position: sticky;
            top: 0;
            background: var(--bg-color);
            z-index: 1005;
            border-bottom: 1px solid var(--border-color);
            font-family: 'Inter', sans-serif;
            margin-bottom: 20px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
        }

        .logo-img {
            height: 32px;
            width: auto;
        }

        .brand-name-text {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: -0.5px;
        }

        nav {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: color 0.2s;
            display: block;
            line-height: 1;
        }

        nav a:hover {
            color: var(--primary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-get-started {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 10px;
            cursor: pointer;
            transition: opacity 0.2s;
            text-transform: uppercase;
            line-height: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-icon {
            width: 18px;
            height: 18px;
            cursor: pointer;
            opacity: 0.8;
            stroke: var(--text-color);
        }

        .theme-toggle {
            background: transparent;
            border: none;
            color: var(--text-color);
            width: auto;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 8px;
            font-size: 1.2rem;
            transition: all 0.2s;
            flex-shrink: 0;
            padding: 0;
            margin-left: 5px;
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        @media (max-width: 1024px) {
            nav { display: none; }
            .menu-toggle { display: flex !important; }
            .btn-get-started { display: none; }
        }

        @media (max-width: 480px) {
            header {
                padding: 15px 10px;
            }
        }

        /* Mobile Menu Styles */
        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            padding: 5px;
            z-index: 1002;
        }

        .menu-toggle span {
            width: 20px;
            height: 2px;
            background-color: var(--text-color);
            transition: all 0.3s;
        }

        .mobile-nav {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100vh;
            background-color: var(--bg-color);
            z-index: 1004;
            display: flex;
            flex-direction: column;
            padding: 120px 40px 40px;
            gap: 30px;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Inter', sans-serif;
            overflow-y: auto;
        }

        .mobile-nav.active {
            right: 0;
        }

        .mobile-nav a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Hamburger Animation */
        .menu-toggle.active span:nth-child(1) { transform: translateY(6px) rotate(45deg); background-color: var(--primary); }
        .menu-toggle.active span:nth-child(2) { opacity: 0; }
        .menu-toggle.active span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); background-color: var(--primary); }

        /* --- Main Intro --- */
        .app-intro {
            text-align: center;
            margin: 40px 0 10px;
            width: 100%;
        }

        .app-name {
            font-size: clamp(1.5rem, 10vw, 2.5rem);
            letter-spacing: 10px;
            font-weight: bold;
            display: block;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .app-summary {
            color: var(--secondary-text);
            font-size: 0.85rem;
            line-height: 1.6;
            max-width: 320px;
            margin: 0 auto;
        }

        /* --- Slider Section --- */
        .slider-section {
            width: 100%;
            padding: 10px 0 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slider-container {
            width: 280px;
            height: 550px;
            position: relative;
            overflow: hidden;
            border: 8px solid var(--accent-color);
            border-radius: 30px;
            background: #000;
        }

        .slider-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slider-dots {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--dot-inactive);
            cursor: pointer;
            transition: all 0.3s;
        }

        .dot.active {
            background: var(--dot-active);
            transform: scale(1.2);
        }

        .play-store-badge {
            display: inline-block;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .play-store-badge:hover {
            transform: scale(1.05);
        }

        .play-store-badge img {
            height: 64px;
            width: auto;
            display: block;
        }

        .cta-section {
            padding: 10px 0 30px;
            text-align: center;
            width: 100%;
        }

        .social-links {
            display: flex;
            gap: 25px;
            justify-content: center;
            margin: 20px 0;
        }

        .social-icon {
            width: 20px;
            height: 20px;
            fill: var(--secondary-text);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .social-icon:hover {
            fill: var(--text-color);
            transform: translateY(-2px);
        }

        .btn-coming-soon {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            padding: 12px 30px;
            font-family: inherit;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .btn-coming-soon:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        footer {
            padding: 30px 20px;
            text-align: center;
            font-size: 0.65rem;
            color: var(--secondary-text);
            letter-spacing: 1px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .footer-copyright-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0.6;
        }

        .footer-logo-small {
            height: 2.2em;
            width: auto;
        }

        /* Hide logos that don't match theme */
        [data-theme="light"] .theme-dark-only { display: none; }
        [data-theme="dark"] .theme-light-only { display: none; }

    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) {
                themeToggle.addEventListener('click', () => {
                    try {
                        const currentTheme = document.documentElement.getAttribute('data-theme');
                        const newTheme = currentTheme === 'light' ? 'dark' : 'light';

                        document.documentElement.setAttribute('data-theme', newTheme);
                        localStorage.setItem('theme', newTheme);

                        // Update favicon
                        const favicon = document.getElementById('favicon');
                        if (favicon) {
                            favicon.href = newTheme === 'light' ? '../svg/absent-black.svg' : '../svg/absent.svg';
                        }
                    } catch (e) {
                        console.error('Failed to save theme preference:', e);
                    }
                });
            }

            // Mobile Menu Toggle
            const menuToggle = document.getElementById('menuToggle');
            const mobileNav = document.getElementById('mobileNav');

            if (menuToggle && mobileNav) {
                menuToggle.addEventListener('click', () => {
                    menuToggle.classList.toggle('active');
                    mobileNav.classList.toggle('active');
                    document.body.style.overflow = mobileNav.classList.contains('active') ? 'hidden' : '';
                });

                // Close menu when clicking links
                const mobileLinks = mobileNav.querySelectorAll('a');
                mobileLinks.forEach(link => {
                    link.addEventListener('click', () => {
                        menuToggle.classList.remove('active');
                        mobileNav.classList.remove('active');
                        document.body.style.overflow = '';
                    });
                });
            }

            // Slider Logic
            const wrapper = document.getElementById('sliderWrapper');
            const dotsContainer = document.getElementById('sliderDots');
            const slides = document.querySelectorAll('.slide');
            let currentSlide = 0;

            if (wrapper && slides.length > 0) {
                // Create dots
                slides.forEach((_, idx) => {
                    const dot = document.createElement('div');
                    dot.classList.add('dot');
                    if (idx === 0) dot.classList.add('active');
                    dot.addEventListener('click', () => goToSlide(idx));
                    dotsContainer.appendChild(dot);
                });

                const dots = document.querySelectorAll('.dot');

                function goToSlide(n) {
                    currentSlide = n;
                    wrapper.style.transform = `translateX(-${currentSlide * 100}%)`;
                    dots.forEach((dot, idx) => {
                        dot.classList.toggle('active', idx === currentSlide);
                    });
                }

                // Auto-advance
                setInterval(() => {
                    currentSlide = (currentSlide + 1) % slides.length;
                    goToSlide(currentSlide);
                }, 5000);

                // Swipe support
                let touchStartX = 0;
                wrapper.addEventListener('touchstart', e => {
                    touchStartX = e.changedTouches[0].screenX;
                }, {passive: true});

                wrapper.addEventListener('touchend', e => {
                    const touchEndX = e.changedTouches[0].screenX;
                    if (touchStartX - touchEndX > 50) goToSlide((currentSlide + 1) % slides.length);
                    if (touchEndX - touchStartX > 50) goToSlide((currentSlide - 1 + slides.length) % slides.length);
                }, {passive: true});
            }
        });
    </script>
</body>
</html>
