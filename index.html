<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DATTARA APPS | Engineering Intentionality</title>
    <style>
        :root {
            --bg-color: #000;
            --text-color: #fff;
            --accent-color: #333;
            --secondary-text: #888;
            --border-color: #444;
            --dot-active: #fff;
            --dot-inactive: #333;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg-color);
            max-width: 1200px;
        }

        .scroll-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            scrollbar-width: none;
        }

        .scroll-content::-webkit-scrollbar { display: none; }

        /* --- SINGLE LINE HEADER --- */
        header {
            width: 100%;
            padding: 20px 0;
            margin-bottom: 20px;
            display: flex;
            justify-content: flex-start;
        }

        .brand-line {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            white-space: nowrap;
            /* Aggressive scaling: font size will be 3.5% of screen width, but capped between 10px and 22px */
            font-size: clamp(10px, 3.5vw, 22px);
            width: fit-content;
            max-width: 95vw;
        }

        .brand-name {
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand-divider {
            margin: 0 12px;
            color: var(--text-color); /* White like DATTARA APPS */
            font-weight: bold;
            display: inline-block;
            transform: scaleY(1.4); /* Makes the divider taller */
            opacity: 0.9;
        }

        .tagline {
            color: var(--secondary-text);
            font-weight: normal;
            letter-spacing: 1px;
        }

        /* --- Main Intro --- */
        .app-intro {
            text-align: center;
            margin: 40px 0;
            width: 100%;
        }

        .app-name {
            font-size: clamp(1.5rem, 10vw, 2.5rem);
            letter-spacing: 10px;
            font-weight: bold;
            display: block;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .app-summary {
            color: var(--secondary-text);
            font-size: 0.85rem;
            line-height: 1.6;
            max-width: 320px;
            margin: 0 auto;
        }

        .cta-section {
            padding: 40px 0;
            text-align: center;
            width: 100%;
        }

        .btn-coming-soon {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            padding: 12px 30px;
            font-family: inherit;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: all 0.3s;
            cursor: default;
        }

        footer {
            padding: 30px 20px;
            text-align: center;
            font-size: 0.65rem;
            color: #444;
            letter-spacing: 1px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="scroll-content">
            <header>
                <div class="brand-line">
                    <span class="brand-name">DATTARA APPS</span>
                    <span class="brand-divider">|</span>
                    <span class="tagline">Intentionality over noise.</span>
                </div>
            </header>

            <main>
                <section class="app-intro">
                    <span class="app-name">UNVEILING</span>
                    <p class="app-summary">
                        A minimalist Android launcher engineered to reclaim your time.
                    </p>
                </section>

                <section class="cta-section">
                    <button class="btn-coming-soon">Coming Soon</button>
                </section>
            </main>

            <footer>
                <div>&copy; 2026 DATTARA APPS. ALL RIGHTS RESERVED.</div>
                <div style="margin-top: 10px;">
                    <a href="mailto:contact@dattara.app" style="color: inherit; text-decoration: none; border-bottom: 1px solid #444;">contact@dattara.app</a>
                </div>
                <div style="margin-top: 10px;">
                    <a href="privacy.html" style="color: #666; text-decoration: none; font-size: 0.6rem; letter-spacing: 1px;">PRIVACY POLICY</a>
                </div>
            </footer>
        </div>
    </div>

</body>
</html>
