<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dattara Apps | Engineering Intentionality</title>
    <link rel="icon" type="image/svg+xml" href="svg/dattara-logo-big.svg">
    <script>
        // Theme initialization - robust and crash-free
        (function() {
            try {
                const theme = localStorage.getItem('theme') || 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                // Fallback for private mode/restricted storage
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        :root {
            --bg-color: #fff;
            --text-color: #000;
            --accent-color: #eee;
            --secondary-text: #666;
            --border-color: #ddd;
            --dot-active: #000;
            --dot-inactive: #ddd;
        }

        [data-theme="dark"] {
            --bg-color: #000;
            --text-color: #fff;
            --accent-color: #333;
            --secondary-text: #888;
            --border-color: #444;
            --dot-active: #fff;
            --dot-inactive: #333;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg-color);
            max-width: 1200px;
            transition: background 0.3s;
            contain: content;
        }

        .scroll-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .scroll-content::-webkit-scrollbar { display: none; }

        /* --- SINGLE LINE HEADER --- */
        header {
            width: 100%;
            padding: 20px 0;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .brand-line {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            white-space: nowrap;
            font-size: clamp(10px, 3.5vw, 22px);
            flex: 1;
            min-width: 0;
        }

        .brand-logo {
            height: 2.2em;
            width: auto;
            display: block;
            flex-shrink: 0;
        }

        .brand-name {
            display: flex;
            align-items: center;
            min-width: 0;
        }

        .brand-divider {
            margin: 0 10px;
            color: var(--text-color);
            font-weight: bold;
            display: inline-block;
            transform: scaleY(1.4);
            opacity: 0.9;
            flex-shrink: 0;
        }

        .tagline {
            color: var(--secondary-text);
            font-weight: normal;
            letter-spacing: 1px;
            font-size: 0.85em;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Theme Toggle --- */
        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 8px;
            font-size: 1.2rem;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .theme-toggle:active {
            transform: scale(0.95);
            background: var(--accent-color);
        }

        @media (max-width: 480px) {
            .brand-divider, .tagline {
                display: none;
            }
            .brand-line {
                font-size: 18px;
            }
            header {
                padding: 15px 0;
            }
        }

        /* --- Main Intro --- */
        .app-intro {
            text-align: center;
            margin: 40px 0;
            width: 100%;
        }

        .app-name {
            font-size: clamp(1.5rem, 10vw, 2.5rem);
            letter-spacing: 10px;
            font-weight: bold;
            display: block;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .app-summary {
            color: var(--secondary-text);
            font-size: 0.85rem;
            line-height: 1.6;
            max-width: 320px;
            margin: 0 auto;
        }

        .cta-section {
            padding: 40px 0;
            text-align: center;
            width: 100%;
        }

        .btn-coming-soon {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            padding: 12px 30px;
            font-family: inherit;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: all 0.3s;
            cursor: default;
        }

        footer {
            padding: 30px 20px;
            text-align: center;
            font-size: 0.65rem;
            color: var(--secondary-text);
            letter-spacing: 1px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .footer-copyright-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0.6;
        }

        .footer-logo-small {
            height: 2.2em;
            width: auto;
        }

        /* Hide logos that don't match theme */
        [data-theme="light"] .theme-dark-only { display: none; }
        [data-theme="dark"] .theme-light-only { display: none; }

    </style>
</head>
<body>

    <div class="app-container">
        <div class="scroll-content">
            <header>
                <div class="brand-line">
                    <div class="brand-name">
                        <img src="svg/dattara-full-black.svg" alt="DATTARA APPS" class="brand-logo theme-light-only" decoding="async">
                        <img src="svg/dattara-full.svg" alt="DATTARA APPS" class="brand-logo theme-dark-only" decoding="async" fetchpriority="high">
                    </div>
                    <span class="brand-divider">|</span>
                    <span class="tagline">Intentionality over noise.</span>
                </div>
                <button class="theme-toggle" id="themeToggle" title="Toggle Theme">
                    <span class="theme-light-only">●</span>
                    <span class="theme-dark-only">○</span>
                </button>
            </header>

            <main>
                <section class="app-intro">
                    <span class="app-name">UNVEILING</span>
                    <p class="app-summary">
                        A minimalist Android launcher engineered to reclaim your time.
                    </p>
                </section>

                <section class="cta-section">
                    <button class="btn-coming-soon">Coming Soon</button>
                </section>
            </main>

            <footer>
                <div class="footer-copyright-line">
                    <img src="svg/dattara-logo-small-black.svg" alt="Logo" class="footer-logo-small theme-light-only" loading="lazy" decoding="async">
                    <img src="svg/dattara-logo-small.svg" alt="Logo" class="footer-logo-small theme-dark-only" loading="lazy" decoding="async">
                    <span>&copy; 2026 DATTARA APPS. ALL RIGHTS RESERVED.</span>
                </div>
                <div style="margin-top: 10px;">
                    <a href="mailto:contact@dattara.app" style="color: inherit; text-decoration: none; border-bottom: 1px solid #444;">contact@dattara.app</a>
                </div>
                <div style="margin-top: 10px;">
                    <a href="privacy.html" style="color: #666; text-decoration: none; font-size: 0.6rem; letter-spacing: 1px;">PRIVACY POLICY</a>
                </div>
            </footer>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('themeToggle');
            if (!themeToggle) return;

            themeToggle.addEventListener('click', () => {
                try {
                    const currentTheme = document.documentElement.getAttribute('data-theme');
                    const newTheme = currentTheme === 'light' ? 'dark' : 'light';

                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                } catch (e) {
                    console.error('Failed to save theme preference:', e);
                }
            });
        });
    </script>
</body>
</html>
