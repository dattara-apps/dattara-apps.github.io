<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="50%" stop-color="#022C22"/>
            <stop offset="100%" stop-color="#064E3B"/>
        </linearGradient>
        <linearGradient id="envelope_grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#94A3B8"/>
            <stop offset="100%" stop-color="#475569"/>
        </linearGradient>
        <linearGradient id="flap_grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34D399"/>
            <stop offset="100%" stop-color="#059669"/>
        </linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.4"/>
        </pattern>
    </defs>

    <!-- Background -->
    <rect width="1200" height="600" rx="20" fill="url(#bg)"/>
    <rect width="1200" height="600" rx="20" fill="url(#grid)"/>

    <!-- Subtle Glowing Security Shield in Background -->
    <circle cx="600" cy="300" r="280" fill="#059669" opacity="0.08" filter="blur(40px)"/>

    <!-- Center Content Group -->
    <g transform="translate(600, 270)">
        <!-- AirgapMail Logo Icon -->
        <g transform="translate(-100, -210) scale(0.39, 0.39)">
            <path d="M 40,120 L 472,120 C 494.1,120 512,137.9 512,160 L 512,416 C 512,438.1 494.1,456 472,456 L 40,456 C 17.9,456 0,438.1 0,416 L 0,160 C 0,137.9 17.9,120 40,120 Z" fill="none" stroke="url(#envelope_grad)" stroke-linejoin="round" stroke-width="32"/>
            <path d="M 40,160 L 256,320 L 472,160" fill="none" stroke="url(#flap_grad)" stroke-linecap="round" stroke-linejoin="round" stroke-width="32"/>
            <circle cx="256" cy="320" r="16" fill="#00FFA3"/>
        </g>

        <!-- Main Title -->
        <text x="0" y="35" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="800" font-size="52" letter-spacing="4">AIRGAPMAIL</text>

        <!-- Subtitle -->
        <text x="0" y="85" text-anchor="middle" fill="#6EE7B7" font-family="Inter, sans-serif" font-weight="600" font-size="20" letter-spacing="1">100% ON-DEVICE EMAIL CLEANER &amp; SECURITY VAULT</text>

        <!-- Badges Row -->
        <g transform="translate(-290, 135)">
            <!-- Badge 1 -->
            <rect x="0" y="0" width="170" height="36" rx="18" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
            <text x="85" y="23" text-anchor="middle" fill="#6EE7B7" font-family="Inter, sans-serif" font-weight="700" font-size="13">🛡️ ZERO CLOUD LOGS</text>

            <!-- Badge 2 -->
            <rect x="195" y="0" width="190" height="36" rx="18" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
            <text x="290" y="23" text-anchor="middle" fill="#6EE7B7" font-family="Inter, sans-serif" font-weight="700" font-size="13">🔒 SQLCIPHER VAULT</text>

            <!-- Badge 3 -->
            <rect x="405" y="0" width="175" height="36" rx="18" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
            <text x="492" y="23" text-anchor="middle" fill="#6EE7B7" font-family="Inter, sans-serif" font-weight="700" font-size="13">⚡ DIRECT OAUTH 2.0</text>
        </g>
    </g>
</svg>