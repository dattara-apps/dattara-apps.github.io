<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .star-flash {
      animation: flash 2s infinite ease-in-out;
      transform-origin: 325px 250px;
    }
    @keyframes flash {
      0%, 100% { opacity: 1; filter: brightness(1) drop-shadow(0 0 2px rgba(255, 215, 0, 0.5)); }
      50% { opacity: 0.8; filter: brightness(1.8) drop-shadow(0 0 15px rgba(255, 215, 0, 0.9)); }
    }
  </style>
  <defs>
    <linearGradient id="logoGradient" x1="50" y1="50" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C62828"/>
      <stop offset="1" stop-color="#FB8C00"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="245" y1="170" x2="405" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="25%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#B38728" />
      <stop offset="75%" stop-color="#FBF5B7" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
  </defs>

  <!-- Stylized D Base -->
  <path d="M120 50 H 300 C 450 50, 450 450, 300 450 H 120 Q 180 250, 120 50 Z" fill="url(#logoGradient)"/>

  <!-- Golden Flashing 8-pointed Star -->
  <path class="star-flash" d="M 325 170 L 335 227 L 367 208 L 348 240 L 405 250 L 348 260 L 367 292 L 335 273 L 325 330 L 315 273 L 283 292 L 302 260 L 245 250 L 302 240 L 283 208 L 315 227 Z" fill="url(#goldGradient)"/>
</svg>
