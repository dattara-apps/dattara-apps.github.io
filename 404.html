<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Dattara Apps</title>
    <link rel="icon" type="image/svg+xml" href="svg/dattara-logo-small.svg">
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('theme') || 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        :root {
            --bg-color: #fff;
            --text-color: #000;
            --secondary-text: #666;
            --accent-color: #f6f8fa;
        }

        [data-theme="dark"] {
            --bg-color: #000;
            --text-color: #fff;
            --secondary-text: #888;
            --accent-color: #0d1117;
        }

        * { box-sizing: border-box; }

        body, html {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 0.3s;
        }

        .container {
            text-align: center;
            padding: 20px;
            z-index: 1;
        }

        .logo-container {
            position: relative;
            margin-bottom: 30px;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        .big-logo {
            width: clamp(180px, 40vw, 300px);
            height: auto;
            opacity: 0.9;
        }

        .error-content {
            background: var(--bg-color);
            padding: 20px;
        }

        .error-title {
            font-size: 1.5rem;
            margin: 10px 0 20px;
            font-weight: normal;
        }

        .error-msg {
            font-size: 0.9rem;
            color: var(--secondary-text);
            max-width: 400px;
            margin: 0 auto 40px;
            line-height: 1.6;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 12px 24px;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
            border-radius: 4px;
        }

        .btn:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        .background-decoration {
            position: absolute;
            font-size: 25vw;
            font-weight: bold;
            opacity: 0.03;
            user-select: none;
            pointer-events: none;
            z-index: 0;
            color: var(--text-color);
        }

        /* Hide logos that don't match theme */
        [data-theme="light"] .theme-dark-only { display: none; }
        [data-theme="dark"] .theme-light-only { display: none; }
    </style>
</head>
<body>
    <div class="background-decoration">404</div>

    <div class="container">
        <div class="logo-container">
            <img src="svg/dattara-logo-big.svg" alt="Dattara" class="big-logo theme-dark-only">
            <img src="svg/dattara-logo-big.svg" alt="Dattara" class="big-logo theme-light-only" style="filter: invert(1);">
        </div>

        <div class="error-content">
            <h1 class="error-title">This is not the page you are looking for.</h1>
            <p class="error-msg">
                The requested URL was not found on this server. <br>
                It may have been intentionally removed to reduce digital noise.
            </p>

            <div class="nav-links">
                <a href="index.html" class="btn">Back Home</a>
                <a href="privacy.html" class="btn">Privacy</a>
            </div>
        </div>
    </div>
</body>
</html>
